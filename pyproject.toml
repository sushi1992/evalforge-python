[project]
name = "evalforge-python"
version = "0.1.0"
description = "A production-shaped evaluation platform for measuring and regression-testing AI-assisted software engineering systems, built with Python and FastAPI."
readme = "README.md"
authors = [
    { name = "Suzan Aydin" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
