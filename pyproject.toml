[project]
name = "evalforge-python"
version = "0.1.0"
description = "A production-shaped evaluation platform for measuring and regression-testing AI-assisted software engineering systems, built with Python and FastAPI."
readme = "README.md"
authors = [
    { name = "Suzan Aydin" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
